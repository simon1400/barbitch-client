name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/barbitch-client
            git pull origin main
            # Keep static files of previous builds for 30 days: pages cached in browsers,
            # Googlebot renders and Clarity replays still reference the old hashed CSS/JS.
            # `next build` wipes .next, so the archive lives outside the project.
            STATIC_ARCHIVE=/opt/barbitch-client-static-archive
            mkdir -p "$STATIC_ARCHIVE"
            if [ -d .next/static ]; then cp -r --update=none .next/static/. "$STATIC_ARCHIVE"/; fi
            find "$STATIC_ARCHIVE" -type f -mtime +30 -delete
            find "$STATIC_ARCHIVE" -mindepth 1 -type d -empty -delete
            npm ci
            # Data cache (unstable_cache / fetch) survives `next build`. Without wiping it the
            # build prerenders feed.xml, the homepage and blog posts from the PREVIOUS build's
            # Strapi data (served stale until revalidate, ~1 h). Webpack/SWC caches stay.
            rm -rf .next/cache/fetch-cache
            npm run build
            cp -r public .next/standalone/
            mkdir -p .next/standalone/.next/static
            cp -r --update=none "$STATIC_ARCHIVE"/. .next/standalone/.next/static/
            cp -r .next/static .next/standalone/.next/
            pm2 restart barbitch-client || pm2 start ecosystem.config.js
            pm2 save
            echo "✅ Deployment completed successfully!"
